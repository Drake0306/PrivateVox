<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LVW</title>
<link rel="stylesheet" href="lvw.css">
<style>
  .row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
  .row .txt { white-space: pre-wrap; margin: 4px 0; }
  .row button, .bar button { font: inherit; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 5px; cursor: pointer; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .bar input { font: inherit; flex: 1; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
</style>
</head>
<body class="panel-body">
  <div class="bar"><strong>History</strong><input id="q" type="search" placeholder="Search dictations…"><span id="count" style="color:var(--muted);font-size:12px"></span><button id="dbgStart" title="Debug: start recording">● Rec</button><button id="dbgStop" title="Debug: stop recording">■ Stop</button></div>
  <div id="rows"></div>
  <p id="status" style="color:var(--muted)"></p>
  <script src="lvw.js"></script>
  <script>
    const rows = document.getElementById('rows'), q = document.getElementById('q'), count = document.getElementById('count'), status = document.getElementById('status');
    function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    async function load() {
      const list = q.value ? await window.lvw.invoke('search_history', { query: q.value }) : await window.lvw.invoke('list_history', { limit: 100, offset: 0 });
      const n = await window.lvw.invoke('history_count');
      count.textContent = n + ' dictations';
      rows.innerHTML = list.length ? '' : '<p style="color:var(--muted)">Nothing dictated yet. Hold the dictation key and speak.</p>';
      for (const d of list) {
        const el = document.createElement('div'); el.className = 'row';
        const when = new Date(d.created_at_ms).toLocaleString();
        el.innerHTML = `<div class="meta"><span>${when}</span><span>${esc(d.app_name || '')}</span><span>${esc(d.model)}</span><span>${(d.duration_ms/1000).toFixed(1)}s</span><span>${esc(d.status)}</span></div>
          <div class="txt">${esc(d.polished_text || d.raw_text)}</div>
          <button data-copy>Copy</button> <button data-del>Delete</button>`;
        el.querySelector('[data-copy]').onclick = async () => { await navigator.clipboard.writeText(d.polished_text || d.raw_text); status.textContent = 'Copied'; setTimeout(() => status.textContent = '', 1500); };
        el.querySelector('[data-del]').onclick = async () => { await window.lvw.invoke('delete_history', { id: d.id }); load(); };
        rows.appendChild(el);
      }
    }
    q.addEventListener('input', load);
    document.getElementById('dbgStart').onclick = () => window.lvw.invoke('debug_start');
    document.getElementById('dbgStop').onclick = () => window.lvw.invoke('debug_stop');
    window.lvw.listen('pill-state', (s) => { status.textContent = s.state + (s.message ? ': ' + s.message : ''); if (s.state === 'pasted') load(); });
    load();
  </script>
</body>
</html>
