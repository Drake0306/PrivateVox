<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrivateVox</title>
<link rel="stylesheet" href="privatevox.css">
</head>
<body class="pill-body">
  <div class="pill idle" id="pill" data-tauri-drag-region title="Click for history">
    <span class="dot" id="dot" data-tauri-drag-region></span>
    <span class="bars" id="bars" hidden><i></i><i></i><i></i><i></i><i></i></span>
    <span class="spin" id="spin" hidden></span>
    <span class="label" id="label" data-tauri-drag-region>PrivateVox</span>
  </div>
  <script src="privatevox.js"></script>
  <script>
    const pill = document.getElementById('pill'), label = document.getElementById('label');
    const bars = document.getElementById('bars'), spin = document.getElementById('spin'), dot = document.getElementById('dot');
    function render(s) {
      pill.className = 'pill ' + s.state;
      bars.hidden = s.state !== 'listening';
      spin.hidden = !(s.state === 'transcribing' || s.state === 'loading_model');
      dot.hidden = !(s.state === 'idle' || s.state === 'listening' || s.state === 'error' || s.state === 'pasted');
      switch (s.state) {
        case 'idle': label.textContent = s.hotkey_hint; break;
        case 'listening': label.textContent = s.countdown != null ? s.seconds.toFixed(0) + 's · stops in ' + s.countdown + 's' : s.seconds.toFixed(0) + 's'; document.documentElement.style.setProperty('--lvl', Math.max(0, Math.min(1, (s.level_db + 60) / 60))); break;
        case 'transcribing': label.textContent = 'Transcribing…'; break;
        case 'loading_model': label.textContent = s.progress == null ? 'Loading model…' : 'Downloading ' + Math.round(s.progress * 100) + '%'; break;
        case 'pasted': label.textContent = s.preview; break;
        case 'error': label.textContent = s.message; break;
      }
    }
    window.pvx.listen('pill-state', render);
    window.pvx.invoke('current_pill_state').then((s) => { if (s) render(s); }).catch(() => {});
    let dragged = false, downAt = 0;
    pill.addEventListener('mousedown', () => { downAt = Date.now(); dragged = false; });
    pill.addEventListener('mousemove', (e) => { if (e.buttons) dragged = true; });
    pill.addEventListener('mouseup', () => { if (!dragged && Date.now() - downAt < 400) window.pvx.invoke('open_panel'); });
  </script>
</body>
</html>
