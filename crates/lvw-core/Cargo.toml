[package]
name = "lvw-core"
description = "LVW core logic: settings, audio, VAD, hotkey machine, text clean-up, history store, lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
cpal = "0.18.2"
rubato = "5.0.1"
whisper-rs = { version = "0.16.0", features = ["metal"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["stream"] }
futures-util = "0.3"
sysinfo = "0.37"
hound = "3.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
