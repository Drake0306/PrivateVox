[package]
name = "privatevox-core"
description = "PrivateVox core logic: settings, audio, VAD, hotkey machine, text clean-up, history store, lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
cpal = "0.18.2"
rubato = "5.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["stream", "blocking", "json"] }
futures-util = "0.3"
sysinfo = "0.37"
hound = "3.5"
base64 = "0.22"
strsim = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

[features]
# Exposes the fake LLM server to other crates' tests.
test-support = []

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

# GPU backend per platform: Metal on Apple Silicon, Vulkan on Windows and Linux (any recent AMD/NVIDIA/Intel GPU).
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }

# GPU memory figures for the strip (DXGI: adapter name, dedicated VRAM, budget, this process's usage).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
