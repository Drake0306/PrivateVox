[package]
name = "privatevox-engine"
description = "PrivateVox speech engine: Engine trait, whisper-rs backend, worker process and supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
privatevox-core = { path = "../privatevox-core" }
postcard = { version = "1.1.3", features = ["use-std"] }
env_logger = "0.11"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The worker waits on its parent process handle (no getppid on Windows).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
hound = "3.5"
privatevox-core = { path = "../privatevox-core", features = ["test-support"] }

# GPU backend per platform: Metal on Apple Silicon, Vulkan on Windows and Linux (any recent AMD/NVIDIA/Intel GPU).
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
