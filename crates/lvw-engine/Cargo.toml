[package]
name = "lvw-engine"
description = "LVW speech engine: Engine trait, whisper-rs backend, worker process and supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
lvw-core = { path = "../lvw-core" }
whisper-rs = { version = "0.16.0", features = ["metal"] }
postcard = { version = "1.1.3", features = ["use-std"] }
env_logger = "0.11"

[dev-dependencies]
hound = "3.5"
