name: Release builds

# Builds PrivateVox for macOS (Apple Silicon), Windows (x64, Vulkan) and Linux (x64, Vulkan) when a version tag is
# pushed, and attaches the bundles to the GitHub release for that tag. Unsigned alpha builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux system packages (Tauri, audio, input, Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libxi-dev libxtst-dev libx11-dev libxkbcommon-dev \
            libvulkan-dev glslc cmake pkg-config

      - name: Vulkan SDK (Windows, provides glslc for the whisper.cpp shaders)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true
          stripdown: true

      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.4

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PrivateVox ${{ github.ref_name }}"
          releaseBody: "See the release notes above. Builds are unsigned alpha builds; follow the install steps in the notes."
          releaseDraft: false
          prerelease: true
          tauriScript: tauri
          args: --target ${{ matrix.target }}
