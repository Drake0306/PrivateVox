name: Release builds

# Builds PrivateVox for Windows (x64, Vulkan) and Linux (x64, Vulkan) when a version tag is pushed, and attaches the
# bundles to the GitHub release for that tag. Unsigned alpha builds. The macOS bundle is built and uploaded from a Mac
# (`cargo tauri build`) until signing is set up, so CI does not overwrite it here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and attach to (e.g. v0.2.0-alpha.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux system packages (Tauri, audio, input, Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libxi-dev libxtst-dev libx11-dev libxkbcommon-dev \
            libvulkan-dev cmake pkg-config

      - name: Vulkan SDK (latest LunarG SDK; provides glslc for the whisper.cpp shaders)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      # whisper.cpp's Vulkan backend configures a nested CMake project (vulkan-shaders-gen). Under the Visual Studio
      # generator that nested configure cannot find cl.exe on the current runner image, so build with Ninja inside an
      # MSVC developer environment instead.
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.4

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Ninja' || '' }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "PrivateVox ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the release notes above. Builds are unsigned alpha builds; follow the install steps in the notes."
          releaseDraft: false
          prerelease: true
          tauriScript: tauri
          args: --target ${{ matrix.target }}
