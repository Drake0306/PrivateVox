[package]
name = "privatevox"
description = "PrivateVox: local Whisper dictation with a floating pill"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "privatevox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7"
rdev = { git = "https://github.com/rustdesk-org/rdev", rev = "0904f23ce496e255461a98848b85c11fa5a62eab" }
ctrlc = { version = "3.4", features = ["termination"] }
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
privatevox-core = { path = "../crates/privatevox-core" }
privatevox-engine = { path = "../crates/privatevox-engine" }
arboard = "3.6.1"
enigo = "0.6.1"
tiny_http = "0.12"
base64 = "0.22"
local-ip-address = "0.6"
mdns-sd = "0.13"

# Host, remote and endpoint tokens live in the OS keychain (design §8.5): Keychain on macOS, Credential Manager on
# Windows. Linux keeps them in settings.json for now (the secret service needs libdbus and a running daemon).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Elevated-window detection (design §12): foreground window → owning process → token elevation.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
tauri-nspanel = "2.1.1"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard"] }

[dev-dependencies]
tempfile = "3"
privatevox-core = { path = "../crates/privatevox-core", features = ["test-support"] }
hound = "3.5"
