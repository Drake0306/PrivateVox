[workspace]
resolver = "2"
members = ["crates/privatevox-core", "crates/privatevox-engine", "src-tauri"]
exclude = ["spike"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Drake0306/PrivateVox"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
debug = 1
